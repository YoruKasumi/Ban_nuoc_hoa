<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký tài khoản | FLORA PERFUME</title>
<meta name="description" content="Tạo tài khoản khách hàng tại FLORA PERFUME.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/customer.css">
</head>
<body>
<a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>

<main id="main">
<div class="wrap auth">
  
  <section class="auth-card" aria-labelledby="h-reg">
    <h1 id="h-reg">Tạo tài khoản</h1>
    <form action="login.html" method="post">
      <div class="form-grid">
        <div class="field full"><label for="hoten">Họ và tên</label><input id="hoten" name="hoten" type="text" autocomplete="name"></div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="sdt">Số điện thoại</label><input id="sdt" name="sdt" type="tel" autocomplete="tel"></div>
        <div class="field"><label for="mk">Mật khẩu</label><input id="mk" name="mk" type="password" minlength="8" autocomplete="new-password"><span class="hint">Tối thiểu 8 ký tự.</span></div>
        <div class="field"><label for="mk2">Xác nhận mật khẩu</label><input id="mk2" name="mk2" type="password" minlength="8" autocomplete="new-password"><span class="hint">Nhập lại mật khẩu.</span></div>
        <div class="field full"><label for="diachi">Địa chỉ mặc định</label><input id="diachi" name="diachi" type="text" autocomplete="street-address" placeholder="Số nhà, tên đường"></div>
        <div class="field full"><label for="tinh">Tỉnh/thành phố</label><select id="tinh" name="tinh"><option value="">Chọn tỉnh/thành phố</option><option selected>TP. Hồ Chí Minh</option><option>Hà Nội</option><option>Đà Nẵng</option><option>Cần Thơ</option></select></div>
        <div class="field"><label for="quan">Quận/huyện</label><select id="quan" name="quan" ><option value="">Chọn quận/huyện</option><option selected>Quận 1</option><option>Quận 3</option><option>Bình Thạnh</option><option>Thủ Đức</option></select></div>
        <div class="field"><label for="phuong">Phường/xã</label><select id="phuong" name="phuong" ><option value="">Chọn phường/xã</option><option selected>Bến Nghé</option><option>Bến Thành</option><option>Đa Kao</option></select></div>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Đăng ký</button>
    </form>
    <p class="auth-switch">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </section>
</div>
</main>

</body>
</html>
