<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | FLORA PERFUME</title>
  <meta name="description" content="Đăng nhập tài khoản khách hàng FLORA PERFUME.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>

<body>
  <a class="skip-link" href="#main">Bỏ qua đến nội dung chính</a>
<header class="site-header">
  <div class="wrap header-top">
    <a class="logo" href="index.html" aria-label="FLORA PERFUME - Trang chủ">FLORA<span>PERFUME</span></a>

    <div class="header-search-container">
      <form class="search-form" action="search.html" method="get" role="search">
        <label class="visually-hidden" for="q-header">Tìm nước hoa theo tên</label>
        <input id="q-header" type="search" name="q" placeholder="Nhập tên nước hoa cần tìm...">
        <button type="submit">Tìm kiếm</button>
      </form>

      <details class="adv-dropdown">
        <summary class="adv-toggle-btn">⚙ Nâng cao ▾</summary>
        <div class="adv-panel-dropdown">
          <form action="advanced-search.html" method="get" role="search" aria-label="Tìm kiếm nâng cao">
            <div class="field">
              <label for="hs-ten">Tên sản phẩm</label>
              <input id="hs-ten" type="search" name="ten" placeholder="Ví dụ: Dior, Chanel...">
            </div>

            <div class="adv-row-3cols">
              <div class="field">
                <label for="hs-loai">Phân loại</label>
                <select id="hs-loai" name="loai">
                  <option value="">Tất cả phân loại</option>
                  <option value="nam">Nước hoa nam</option>
                  <option value="nu">Nước hoa nữ</option>
                  <option value="unisex">Unisex</option>
                  <option value="cao-cap">Nước hoa cao cấp</option>
                </select>
              </div>
              <div class="field">
                <label for="hs-min">Giá từ (VNĐ)</label>
                <div class="input-vnd">
                  <input id="hs-min" type="text" name="gia-min" inputmode="numeric" spellcheck="false" placeholder="0"
                    oninput="this.value = this.value.replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
                </div>
              </div>
              <div class="field">
                <label for="hs-max">Giá đến (VNĐ)</label>
                <div class="input-vnd">
                  <input id="hs-max" type="text" name="gia-max" inputmode="numeric" spellcheck="false" placeholder="Không giới hạn"
                    oninput="this.value = this.value.replace(/\D/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')">
                </div>
              </div>
            </div>

            <div class="adv-actions">
              <button class="btn btn-primary" type="submit">Áp dụng tìm kiếm</button>
              <button class="btn btn-outline" type="reset">Đặt lại</button>
            </div>
          </form>
        </div>
      </details>
    </div>

    <div class="header-actions">
      <a class="hide-sm" href="login.html">Đăng nhập</a>
      <a class="hide-sm" href="register.html">Đăng ký</a>
      <a class="cart-link" href="cart.html" aria-label="Giỏ hàng, 3 sản phẩm">Giỏ hàng <span class="cart-count">3</span></a>
    </div>
  </div>

  <nav class="main-nav" aria-label="Danh mục sản phẩm">
    <div class="wrap">
      <ul>
        <li><a href="products.html">Tất cả sản phẩm</a></li>
        <li><a href="products-nam.html">Nước hoa nam</a></li>
        <li><a href="products-nu.html">Nước hoa nữ</a></li>
        <li><a href="products-unisex.html">Unisex</a></li>
        <li><a href="products-cao-cap.html">Nước hoa cao cấp</a></li>
      </ul>
    </div>
  </nav>
</header>
  <main id="main">
    <div class="wrap auth narrow">
      <section class="auth-card" aria-labelledby="h-login">
        <h1 id="h-login">Đăng nhập</h1>
        <form action="home-log.html" method="post">
          <div class="field"><label for="tk">Email hoặc tên đăng nhập</label><input id="tk" name="tk" type="text"
              autocomplete="username"></div>
          <div class="field"><label for="mk">Mật khẩu</label><input id="mk" name="mk" type="password"
              autocomplete="current-password"></div>
          <div class="check"><input id="nho" name="nho" type="checkbox"><label for="nho">Ghi nhớ đăng nhập</label></div>
          <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
        </form>
        <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      </section>
    </div>
  </main>
</body>

</html>
