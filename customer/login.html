<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | FLORA PERFUME</title>
  <meta name="description" content="Đăng nhập tài khoản khách hàng FLORA PERFUME.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/customer.css">
</head>

<body>
  <main id="main">
    <div class="wrap auth narrow">
      <section class="auth-card" aria-labelledby="h-login">
        <h1 id="h-login">Đăng nhập</h1>
        <form action="home-log.html" method="post">
          <div class="field"><label for="tk">Email hoặc tên đăng nhập</label><input id="tk" name="tk" type="text"
              autocomplete="username"></div>
          <div class="field"><label for="mk">Mật khẩu</label><input id="mk" name="mk" type="password"
              autocomplete="current-password"></div>
          <div class="check"><input id="nho" name="nho" type="checkbox"><label for="nho">Ghi nhớ đăng nhập</label></div>
          <button class="btn btn-primary btn-block" type="submit">Đăng nhập</button>
        </form>
        <p class="auth-switch">Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      </section>
    </div>
  </main>
</body>

</html>
