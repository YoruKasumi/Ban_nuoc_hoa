<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Quản trị | FLORA PERFUME
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
  </head>
  <body class="admin-login">
    <main class="login-card">
      <div class="logo">
        FLORA
        <span>
          PERFUME
        </span>
      </div>
      <p class="eyebrow">
        KHU VỰC QUẢN TRỊ
      </p>
      <h1>
        Chào mừng trở lại
      </h1>
      <p class="muted">
        Đăng nhập để quản lý cửa hàng FLORA PERFUME.
      </p>
      <form action="index.html" novalidate>
        <div class="field">
          <label for="email">
            Email quản trị
          </label>
          <input id="email" type="email" placeholder="admin@flora.vn">
        </div>
        <div class="field">
          <label for="password">
            Mật khẩu
          </label>
          <input id="password" type="password" placeholder="Nhập mật khẩu">
        </div>
        <button class="btn btn-primary btn-block">
          Đăng nhập quản trị
        </button>
      </form>
      </main>
    
</body>
</html>
